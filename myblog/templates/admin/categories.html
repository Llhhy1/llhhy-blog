{% extends "admin/base.html" %}
{% block title %}分类管理{% endblock %}
{% block content %}
  <h1 class="page-title">分类管理</h1>
  <form method="post" action="{{ url_for('admin.categories') }}" class="inline-form">
        {{ csrf_input() }}
    <input type="text" name="name" placeholder="新分类名称" required>
    <button type="submit" class="btn">添加</button>
  </form>
  <table class="admin-table">
    <thead><tr><th>名称</th><th>slug</th><th>操作</th></tr></thead>
    <tbody>
      {% for c in cats %}
        <tr>
          <td>{{ c.name }}</td>
          <td>{{ c.slug }}</td>
          <td>
            <form method="post" action="{{ url_for('admin.delete_category', cid=c.id) }}" class="inline-form" onsubmit="return confirm('确定删除？该分类下文章会变无分类');">
                  {{ csrf_input() }}
              <button type="submit" class="link-danger">删除</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="3">暂无分类</td></tr>
      {% endfor %}
    </tbody>
  </table>
  <a class="btn" href="{{ url_for('admin.dashboard') }}">返回仪表盘</a>
{% endblock %}

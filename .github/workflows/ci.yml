name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # 与生产环境一致：Python 3.13
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r myblog/requirements.txt
          pip install pytest
      - name: Run tests
        env:
          SECRET_KEY: ci-secret-key
          ADMIN_PASSWORD: ci-admin-password
        run: |
          python -m pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    # 前端构建校验：保证每次 push/PR 都能 `npm run build` 通过（v3.11.0 起纳入 CI）
    defaults:
      run:
        working-directory: vue-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

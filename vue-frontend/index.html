<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的博客</title>
  <meta name="description" content="独立开发者的个人博客：技术实践、AI 大模型观察与原创解压小游戏。" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- v3.15.0 分享卡片：站点级默认 OG/社交 meta（文章页由 PostView 动态覆盖 title/description/image） -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LLHhy Blog" />
  <meta property="og:title" content="我的博客" />
  <meta property="og:description" content="独立开发者的个人博客：技术实践、AI 大模型观察与原创解压小游戏。" />
  <meta property="og:image" content="/og-default.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="我的博客" />
  <meta name="twitter:description" content="独立开发者的个人博客：技术实践、AI 大模型观察与原创解压小游戏。" />
  <meta name="twitter:image" content="/og-default.png" />
  <script>
    // 防闪烁：CSS 生效前先定好主题
    (function () {
      try {
        var t = localStorage.getItem("theme");
        var dark = t === "dark" ||
          (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

{% extends "admin/base.html" %}
{% block title %}邮件设置{% endblock %}
{% block content %}
  <h1 class="page-title">📧 邮件设置（新文章通知订阅者）</h1>
  <p class="stats-tip">配置 SMTP 后，新文章发布会自动给订阅者发送通知邮件。也可用下方「发送测试邮件」验证配置是否可用。
  设置会保存到数据库（无需再配环境变量）；若已配置环境变量 SMTP_*，此处留空则沿用环境变量值。</p>

  <form method="post" action="{{ url_for('admin.email_settings') }}" class="edit-form">
    <input type="hidden" name="action" value="save">
    <label>SMTP 服务器地址（如 smtp.qq.com / smtp.163.com）</label>
    <input type="text" name="mail_host" value="{{ settings.mail_host or '' }}" placeholder="smtp.qq.com">

    <label>SMTP 端口</label>
    <input type="number" name="mail_port" value="{{ settings.mail_port or '465' }}" placeholder="465（SSL）或 587（TLS）">

    <label>邮箱账号（发件人登录名）</label>
    <input type="text" name="mail_username" value="{{ settings.mail_username or '' }}" placeholder="your@qq.com" autocomplete="off">

    <label>SMTP 授权码 / 密码</label>
    <input type="password" name="mail_password" value="" placeholder="留空则保持已保存的值（不显示原密码）" autocomplete="new-password">

    <label>发件人显示地址（一般等于邮箱账号）</label>
    <input type="text" name="mail_from" value="{{ settings.mail_from or '' }}" placeholder="your@qq.com">

    <label class="checkbox-row">
      <input type="checkbox" name="mail_use_ssl" {{ 'checked' if (settings.mail_use_ssl or 'true') != 'false' }}>
      <span>使用 SSL 加密（465 端口勾选；587 端口取消勾选走 STARTTLS）</span>
    </label>

    <button type="submit" class="btn">保存邮件设置</button>
  </form>

  <hr style="border:none;border-top:1px solid #eee;margin:28px 0;">

  <h3 style="margin-top:0;">✉️ 发送测试邮件</h3>
  <form method="post" action="{{ url_for('admin.email_settings') }}" class="edit-form" style="max-width:520px;">
    <input type="hidden" name="action" value="test">
    <label>测试收件人邮箱</label>
    <input type="email" name="test_to" required placeholder="you@example.com">
    <p class="stats-tip" style="margin-top:6px;">将用下方表单里填写的值（含新密码）立即发送一封测试邮件；不填密码则用已保存的密码。不会保存本次改动。</p>
    <button type="submit" class="btn">发送测试邮件</button>
  </form>
{% endblock %}

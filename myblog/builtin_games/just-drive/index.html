<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>就是开车 · NEON</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="stage" aria-label="就是开车游戏画面"></canvas>

  <div id="hud">
    <div class="chip"><span class="k">里程</span><b id="km">0.0</b><em>km</em></div>
    <div class="chip mid"><span class="k">速度</span><b id="spd">0</b><em>km/h</em></div>
    <div class="chip"><span class="k">擦肩连击</span><b id="combo" class="gold">0</b><em>×</em></div>
    <button id="snd" type="button" aria-label="声音">🔊</button>
  </div>
  <div id="bars">
    <div class="bar boost"><i id="boost" style="width:0%"></i></div>
  </div>
  <p id="line">夜路很长，把油门踩进霓虹里。</p>

  <div id="overlay">
    <h1>就是开车 · NEON</h1>
    <p>左右滑动 / ← → 控车。<br />擦肩超车积 <b>连击</b>，穿过 <b class="gold">氮气光带</b> 冲刺。<br />撞车不掉命，只掉面子（和速度）。</p>
    <label>你的 ID（用于大神榜）</label>
    <input id="pid" maxlength="16" placeholder="比如：午夜飞车手" />
    <button id="m40" type="button">正式模式 · 孤独 40 分钟</button>
    <button id="m1" type="button">试驾模式 · 1 分钟（体验用）</button>
    <div id="board"></div>
  </div>

  <div id="final" class="hidden">
    <h2>🏁 到……到了？</h2>
    <p id="fscore"></p>
    <p id="frank"></p>
    <p id="mock">恭喜，你孤独地浪费了 X 分 Y 秒。前方没有出口，也没有人等你。</p>
    <button id="again" type="button">再开一遍？我不信</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
